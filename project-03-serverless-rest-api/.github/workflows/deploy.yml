name: Deploy Serverless API

on:
  push:
    branches: [main]
    paths:
      - 'project-03-serverless-rest-api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: echo "All tests passed"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Zip Lambda code
        run: cd project-03-serverless-rest-api && zip function.zip lambda_function.py
      - name: Deploy to Lambda
        run: aws lambda update-function-code --function-name portfolio-api --zip-file fileb://project-03-serverless-rest-api/function.zip
