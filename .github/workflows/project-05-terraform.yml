name: "Project 5 - Terraform Three-Tier"

on:
  push:
    paths:
      - "project-05-terraform-three-tier/**"
    branches: [main]
  pull_request:
    paths:
      - "project-05-terraform-three-tier/**"
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: project-05-terraform-three-tier
  AWS_REGION: eu-west-2

jobs:
  format:
    name: "Format Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  validate:
    name: "Validate Code"
    runs-on: ubuntu-latest
    needs: format
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
    
  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    defaults:
      run: 
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend=false

      - name: Check file structure
        run: |
          echo "Checking required Terraform files..."
          for file in provider.tf variable.tf vpc.tf security.tf alb.tf ec2.tf rds.tf output.tf; do
            if [ ! -f "$file" ]; then
              echo "Missing: $file"
              exit 1
            fi
            echo "Found: $file"
          done

  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
     - name: Checkout Code
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Configure AWS Credentials
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ env.AWS_REGION }}

     - name: Terraform Init
       run: terraform init

     - name: Terraform Plan
       run: terraform plan -no-color
  
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: [format,validate,test,plan]
    if: github.ref == 'refs/head/main' && github.event_name = 'push'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
     - name: checkout code
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Configure AWS Credentials
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ env.AWS_REGION }}

     - name: Terraform Init
       run: terraform init

     - name: Terraform Apply
       run: terraform apply -auto-approve


