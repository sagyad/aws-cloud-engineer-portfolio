
name: "Project 7 - Monitoring and Alerts"

on:
  push:
    paths:
      - "project-07-monitoring-and-alerts/**"
      - ".github/workflows/project-07-monitoring-and-alerts.yml"
    branches: [main]
  pull_request:
    paths:
      - "project-07-monitoring-and-alerts/**"
      - ".github/workflows/project-07-monitoring-and-alerts.yml"
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  WORKING_DIR: project-07-monitoring-and-alerts/terraform
  AWS_REGION: eu-west-2

jobs:
  format:
    name: "Terraform Format"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    needs: format
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false

      - name: Check Required Files
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          for file in provider.tf variables.tf locals.tf ec2.tf vpc.tf security.tf alb.tf sns.tf alarm.tf dashboard.tf outputs.tf; do
            if [ ! -f "$file" ]; then
              echo "Missing: $file" && exit 1
            fi
            echo "Found: $file"
          done

  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -lock=false

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -no-color -lock=false
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -lock=false

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve -lock=false
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

