name: "Project 6 - Device Farm + Appium"

on:
  push:
    paths:
      - "project-06-device-farm-appium/**"
      - ".github/workflows/project-06-device-farm.yml"
    branches: [main]
  pull_request:
    paths:
      - "project-06-device-farm-appium/**"
      - ".github/workflows/project-06-device-farm.yml"
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  WORKING_DIR: project-06-device-farm-appium/terraform
  AWS_REGION: "us-west-2"

jobs:
  format:
    name: "Terraform Format"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Format Check
       run: terraform fmt -check -recursive

  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
     - name: Checkout
       uses: actions/checkout@v4
    
     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Terraform Init
       run: terrform init -backend=false

     - name: Terraform Validate
       run: terraform validate

  test: 
    name: "Run Appium Tests"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: project-06-device-farm-appium/tests
    steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Setup Python
       uses: actions/setup-python@v5
       with:
          python-version: "3.11"

     - name: Install Dependencies
       run: pip install -r requirments.txt

     - name: Run Tests
       run: pytest -v --tb=short

  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Configure AWS Credentials
       uses: aws-actions/configure-aws-credentials@v4
       with:
          aws-access-key-id:  ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

     - name: Terraform Init
       run: terraform init 

     - name: Terraform Plan
       run: terraform plan -no-color

  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
     - name: Checkout
       uses: actions/checkout@v4
    
     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3
     
     - name: Configure AWS Credentials
       uses: aws-actions/configure-aws-credentials@v4
       with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
     - name: Terraform Init
       run: terraform init

     - name: Terraform Apply
       run: terraform apply -auto-approve